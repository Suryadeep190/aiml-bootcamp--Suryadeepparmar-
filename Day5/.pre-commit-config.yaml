repos:
  - repo: local
    hooks:
      - id: black
        name: Black Formatter
        entry: black --check
        language: system
        types: [python]
        files: ^Day5/

      - id: ruff
        name: Ruff Linter
        entry: ruff check
        language: system
        types: [python]
        files: ^Day5/

      - id: mypy
        name: Mypy Type Checker
        entry: mypy Day5/mathutils.py
        language: system
        pass_filenames: false